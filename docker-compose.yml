services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: calculadora_rlc
      DB_USER: ${DB_USER:-calculadora}
      DB_PASSWORD: ${DB_PASSWORD:-rlc_local_password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: calculadora_rlc
      MYSQL_USER: ${DB_USER:-calculadora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rlc_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rlc_root_local_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
